<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常陆茉子的学习提醒</title>
  <style>
    /* SECTION: base */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 50%, #e0f7fa 100%);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    /* SECTION: pages */
    .page {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .page.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .page.visible {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    /* SECTION: card */
    .card {
      position: relative;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(255,255,255,0.6);
      max-width: 480px;
      width: 90%;
    }

    .card-result {
      animation: bounceIn 0.6s ease-out;
    }

    @keyframes bounceIn {
      0%   { opacity: 0; transform: scale(0.5); }
      60%  { opacity: 1; transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* SECTION: sparkles */
    .sparkle {
      position: absolute;
      font-size: 20px;
      color: #ffab91;
      animation: twinkle 2s ease-in-out infinite;
    }
    .sparkle.s1 { top: 16px; left: 24px; }
    .sparkle.s2 { top: 20px; right: 28px; color: #80cbc4; animation-delay: 0.7s; }
    .sparkle.s3 { bottom: 16px; right: 40px; color: #ce93d8; animation-delay: 1.4s; }
    .sparkle.s4 { bottom: 18px; left: 30px; color: #ffd54f; animation-delay: 1s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.3); }
    }

    /* SECTION: text */
    .title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #5c6bc0;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .emoji-row {
      font-size: 1.5rem;
      margin-bottom: 32px;
      letter-spacing: 8px;
    }

    /* SECTION: result-text */
    .main-text {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e91e63, #ff6090, #ab47bc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.6;
      margin-bottom: 16px;
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      from { filter: drop-shadow(0 0 4px rgba(233,30,99,0.2)); }
      to   { filter: drop-shadow(0 0 12px rgba(233,30,99,0.4)); }
    }

    .sub-text {
      font-size: 1rem;
      color: #9e9e9e;
      margin-bottom: 28px;
    }

    /* SECTION: buttons */
    .btn {
      display: inline-block;
      padding: 14px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ec407a, #ab47bc);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(236,64,122,0.3);
      min-height: 48px;
      min-width: 48px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(236,64,122,0.45);
    }

    .btn:active { transform: translateY(0); }

    .btn-back {
      display: inline-block;
      padding: 12px 40px;
      font-size: 1rem;
      font-weight: 600;
      color: #ab47bc;
      background: transparent;
      border: 2px solid #ab47bc;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 48px;
      min-width: 48px;
    }

    .btn-back:hover {
      background: #ab47bc;
      color: #fff;
      box-shadow: 0 4px 16px rgba(171,71,188,0.3);
    }

    .btn-back:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <!-- SECTION: page-main -->
  <div id="pageMain" class="page visible">
    <div class="card">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✧</span>
      <span class="sparkle s3">✦</span>
      <h1 class="title">常陆茉子爱玩FPS</h1>
      <p class="subtitle">快去背你的铁路发展史！</p>
      <div class="emoji-row">🚂 📚 🎯</div>
      <button id="learnBtn" class="btn" data-primary-action>马上学</button>
    </div>
  </div>

  <!-- SECTION: page-result -->
  <div id="pageResult" class="page hidden">
    <div class="card card-result">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✧</span>
      <span class="sparkle s4">★</span>
      <span class="sparkle s3">✦</span>
      <p class="main-text">Ciallo～(∠・ω&lt; )⌒★</p>
      <p class="sub-text">—— 茉子已经在学习了 ——</p>
      <button id="backBtn" class="btn-back">回去继续学</button>
    </div>
  </div>

  <!-- SECTION: script -->
  <script>
    var pageMain = document.getElementById('pageMain');
    var pageResult = document.getElementById('pageResult');

    document.getElementById('learnBtn').addEventListener('click', function () {
      pageMain.classList.remove('visible');
      pageMain.classList.add('hidden');
      pageResult.classList.remove('hidden');
      pageResult.classList.add('visible');
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      pageResult.classList.remove('visible');
      pageResult.classList.add('hidden');
      pageMain.classList.remove('hidden');
      pageMain.classList.add('visible');
    });
  </script>
</body>
</html>
